{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BeeFlow | Gestion Apicole{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/beeflow.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="frontoffice">

    {% include "includes/frontoffice_header.html" %}

    <main class="front-main">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/frontoffice_footer.html" %}

    <script src="{% static 'js/beeflow.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
