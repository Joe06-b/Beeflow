<div class="field{% if champ.errors %} has-error{% endif %}">
  <label for="{{ champ.id_for_label }}">
    {{ champ.label }}{% if champ.field.required %} <span class="req">*</span>{% endif %}
  </label>
  {{ champ }}
  {% if champ.help_text %}<small class="field-help">{{ champ.help_text }}</small>{% endif %}
  {% for erreur in champ.errors %}
    <span class="field-error">{% include "includes/icon.html" with i="alert" %} {{ erreur }}</span>
  {% endfor %}
</div>
