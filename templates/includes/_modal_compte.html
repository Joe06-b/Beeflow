<!-- ============================================================
     MODIFIER MON COMPTE (partagé : administrateur ET apiculteur)
     INTÉGRATION : le module utilisateurs (travail de l'équipe) fournira
     la vue ; il suffira de mettre son URL dans action="" et de retirer
     data-demo. Les noms des champs (name="...") sont ceux de User.
     ============================================================ -->

<dialog class="modal" id="modal-compte" aria-labelledby="modal-compte-titre">
    <form method="post" action="{% url 'utilisateurs:modifier_mon_compte' %}" class="modal-box" data-account-form novalidate>
        {% csrf_token %}
        <div class="modal-head">
            <div>
                <h2 id="modal-compte-titre">Modifier mon compte</h2>
                <p>Gérez vos informations personnelles.</p>
            </div>
            <button type="button" class="icon-btn" data-modal-close aria-label="Fermer">{% include "includes/icon.html" with i="x" %}</button>
        </div>

        <div class="modal-body">
            <div class="form-row">
                <div class="field">
                    <label for="acc-username">Nom d'utilisateur <span class="req">*</span></label>
                    <input class="bf-input" id="acc-username" name="username"
                        value="{{ request.user.username|default:'' }}" placeholder="Nom d'utilisateur" required
                        autocomplete="username">
                </div>
                <div class="field">
                    <label for="acc-email">Adresse e-mail</label>
                    <input class="bf-input" id="acc-email" name="email" type="email"
                        value="{{ request.user.email|default:'' }}" placeholder="nom@exemple.com" autocomplete="email">
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="acc-prenom">Prénom</label>
                    <input class="bf-input" id="acc-prenom" name="first_name"
                        value="{{ request.user.first_name|default:'' }}" placeholder="Prénom" autocomplete="given-name">
                </div>
                <div class="field">
                    <label for="acc-nom">Nom</label>
                    <input class="bf-input" id="acc-nom" name="last_name"
                        value="{{ request.user.last_name|default:'' }}" placeholder="Nom" autocomplete="family-name">
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="acc-naissance">Date de naissance <span class="req">*</span></label>
                    <input class="bf-input" id="acc-naissance" name="date_naissance" type="date" value="{{ request.user.date_naissance|date:'Y-m-d' }}" required>
                </div>
                <div class="field">
                    <label for="acc-tel">Téléphone <span class="req">*</span></label>
                    <input class="bf-input" id="acc-tel" name="telephone" type="tel" placeholder="Numéro de téléphone" value="{{ request.user.telephone|default:'' }}"
                        autocomplete="tel" required>
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="acc-sexe">Sexe <span class="req">*</span></label>
                    <select class="bf-input" id="acc-sexe" name="sexe" required>
                        <option value="">Sélectionnez le sexe</option>
                        <option value="homme" {% if request.user.sexe == 'homme' %}selected{% endif %}>Homme</option>
                        <option value="femme" {% if request.user.sexe == 'femme' %}selected{% endif %}>Femme</option>
                    </select>
                </div>
            </div>

            <fieldset class="modal-section">
                <legend>{% include "includes/icon.html" with i="lock" class="ico-sm" %} Mot de passe</legend>
                <div class="field">
                    <label for="acc-mdp">Mot de passe actuel <span class="req">*</span></label>
                    <input class="bf-input" id="acc-mdp" name="old_password" type="password"
                        placeholder="Obligatoire pour enregistrer" required>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="acc-mdp1">Nouveau mot de passe</label>
                        <input class="bf-input" id="acc-mdp1" name="new_password1" type="password"
                            placeholder="Laisser vide pour le garder">
                    </div>
                    <div class="field">
                        <label for="acc-mdp2">Confirmer le mot de passe</label>
                        <input class="bf-input" id="acc-mdp2" name="new_password2" type="password"
                            placeholder="Retaper le nouveau mot de passe">
                    </div>
                </div>
            </fieldset>
            <p class="field-error" data-form-error hidden></p>
        </div>

        <div class="modal-foot">
            <button type="button" class="btn btn-ghost" data-modal-close>Annuler</button>
            <button type="submit" class="btn btn-honey">{% include "includes/icon.html" with i="check" %} Enregistrer
                les modifications</button>
        </div>
    </form>
</dialog>
