<div class="meteo-scene" data-meteo-scene role="img" aria-label="Diorama météo en cours de chargement">
  <canvas class="meteo-scene-canvas" aria-hidden="true"></canvas>
  <div class="meteo-scene-fallback" data-scene-fallback hidden>
    <span class="meteo-scene-fallback-sun" aria-hidden="true"></span>
    <p data-scene-fallback-label>La scène 3D sera disponible lorsque le navigateur le permettra.</p>
    <span class="meteo-scene-fallback-land" aria-hidden="true"></span>
  </div>
  <div class="meteo-scene-caption" data-scene-caption>
    <span class="meteo-scene-caption-dot" aria-hidden="true"></span>
    <span data-scene-caption-text>Préparation du paysage</span>
  </div>
  <span class="meteo-scene-grab" aria-hidden="true">Glisser pour observer · Molette pour zoomer</span>
</div>
