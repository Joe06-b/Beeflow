{# Recherche (identifiant ou code-barres), filtres et tri. Paramètre : reset_url #}
<form method="get" class="toolbar pr-toolbar" role="search">
  <div class="search">{% include "includes/icon.html" with i="search" %}{{ form.q }}</div>
  {{ form.categorie }}
  {{ form.origine }}
  {{ form.etat }}
  {{ form.tri }}
  {{ form.sens }}
  <div class="toolbar-actions">
    <button type="submit" class="btn btn-dark">{% include "includes/icon.html" with i="filter" %} Filtrer</button>
    <a href="{{ reset_url }}" class="icon-btn" title="Réinitialiser" aria-label="Réinitialiser la recherche et les filtres">{% include "includes/icon.html" with i="x" %}</a>
  </div>
</form>
