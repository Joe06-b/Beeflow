<div class="bo-head">
    <nav class="tabs" aria-label="Sections du module utilisateurs">
        <a href="{% url 'utilisateurs:liste' %}" class="{% if onglet == 'liste' %}is-active{% endif %}" {% if onglet == 'liste' %}aria-current="page"{% endif %}>
            {% include "includes/icon.html" with i="users" %} Gestion des utilisateurs
        </a>
        <a href="{% url 'utilisateurs:statistiques' %}" class="{% if onglet == 'stats' %}is-active{% endif %}" {% if onglet == 'stats' %}aria-current="page"{% endif %}>
            {% include "includes/icon.html" with i="chart" %} Statistiques
        </a>
    </nav>
    <div class="page-actions">
        <a href="{% url 'utilisateurs:export_csv' %}?{{ params }}" class="btn btn-ghost" title="Exporter la liste au format CSV">
            {% include "includes/icon.html" with i="download" %} Exporter en CSV
        </a>
        <a href="{% url 'utilisateurs:ajouter' %}" class="btn btn-honey">
            {% include "includes/icon.html" with i="plus" %} Ajouter un utilisateur
        </a>
    </div>
</div>
